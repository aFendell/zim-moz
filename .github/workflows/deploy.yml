# Inert until the repo is pushed to GitHub and Pages source is set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn build
      # Basemap is served same-origin from Pages (release URLs redirect without CORS headers).
      # Repo variable BASEMAP_URL points at the Release asset; it is copied into dist/ here.
      - name: Fetch basemap into dist
        run: |
          curl -fsSL -o dist/zim-moz.pmtiles "${{ vars.BASEMAP_URL }}"
          curl -fsSL -o dist/zim-moz-terrain.pmtiles "${{ vars.TERRAIN_URL }}"
          ls -lh dist/*.pmtiles
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
